<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance voice agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  pre { background: #f4f4f4; padding: 12px; min-height: 80px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Insurance voice agent</h1>
<p>M0 deploy check. The voice UI arrives in M4.</p>
<button id="ping">Test WebSocket echo</button>
<pre id="out"></pre>
<script>
  const out = document.getElementById('out');
  fetch('/healthz').then(r => r.json()).then(j => out.textContent = 'healthz: ' + JSON.stringify(j) + '\n');
  document.getElementById('ping').onclick = () => {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/echo');
    const t0 = performance.now();
    ws.onopen = () => ws.send('hello ' + new Date().toISOString());
    ws.onmessage = e => { out.textContent += 'echo: ' + e.data + ' (' + Math.round(performance.now() - t0) + ' ms)\n'; ws.close(); };
    ws.onerror = () => out.textContent += 'websocket error\n';
  };
</script>
</body>
</html>
